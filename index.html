<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖心聊天助手 | 老年陪伴</title>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 全屏容器 */
        body {
            background: #f0f4f7;
            font-family: "Microsoft YaHei", sans-serif;
            height: 100vh;
            /* 关键：让body占满整个视口 */
            display: flex;
            flex-direction: column;
        }

        /* 标题栏 */
        header {
            background: #ffb3bf;
            padding: 15px;
            text-align: center;
            flex-shrink: 0;
            /* 禁止标题栏压缩 */
        }

        /* 聊天窗口容器 */
        .chat-container {
            flex: 1;
            /* 占据剩余空间 */
            width: 100%;
            max-width: 800px;
            /* 增大电脑端宽度 */
            margin: 0 auto;
        }

        /* iframe自适应 */
        iframe {
            width: 100%;
            height: 100%;
            /* 继承容器高度 */
            border: none;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            .chat-container {
                max-width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2 style="color: white; margin: 0;">🌸 24小时暖心聊天陪伴 🌸</h2>
    </header>

    <div class="chat-container">
        <iframe src="http://localhost/chat/h80Yz8EZjvO3VHGr" allow="microphone" title="老年聊天助手"></iframe>
    </div>

    <footer style="text-align: center; padding: 10px; color: #666; flex-shrink: 0;">
        <small>技术支持：Dify AI | 服务时间：7×24小时</small>
    </footer>
</body>

</html>
